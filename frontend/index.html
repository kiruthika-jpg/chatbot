<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-title">
                <span class="status-dot"></span>
                <h1>🤖 AI Assistant</h1>
            </div>
            <div class="header-buttons">
                <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle Dark Mode">🌙</button>
                <button class="icon-btn" onclick="clearChat()" title="Clear Chat">🧹</button>
            </div>
        </div>

        <!-- Chat Messages Box -->
        <div id="chat-box">
            <div class="message-wrapper bot-wrapper">
                <div class="avatar">🤖</div>
                <div class="message-bubble bot-bubble">
                    <p>Hello! I am your AI assistant. How can I help you today?</p>
                    <span class="timestamp">Just now</span>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="typing-indicator hidden">
            <div class="avatar">🤖</div>
            <div class="dots-container">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send 🚀</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
